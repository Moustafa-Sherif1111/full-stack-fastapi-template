name: Release - Production Deployment

# Triggers on push to main/master after PR merge
# This is the final step in the Release Agent V2 workflow
on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'release-notes.md'
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  verify-tests:
    name: Verify Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Start test dependencies
        run: |
          docker compose down -v --remove-orphans
          docker compose up -d --wait db mailpit

      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run tests
        run: uv run bash scripts/tests-start.sh "Production verification for ${{ github.sha }}"
        working-directory: backend

      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans

  build-production:
    name: Build for Production
    needs: [verify-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend (production)
        run: bun run --filter frontend build
        env:
          VITE_API_URL: ""
          NODE_ENV: production

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Prepare backend
        run: uv sync
        working-directory: backend

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            frontend/dist
            backend
          retention-days: 30

  deploy-production:
    name: Deploy to Production
    needs: [build-production]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://full-stack-fastapi.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-build

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Prepare database (Production)
        run: uv run bash scripts/prestart.sh
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER: ${{ vars.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
        # REMOVED: continue-on-error: true
        # CRITICAL: Production database migrations MUST succeed
        # Any failure here should immediately halt the deployment

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to Production environment"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployment time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "✅ Production deployment simulation successful"
        # TODO: Replace with actual production deployment command
        # CRITICAL: Ensure zero-downtime deployment strategy (blue-green, rolling, canary)
        # Examples:
        #   Docker: docker compose -f docker-compose.prod.yml up -d --no-deps --build api
        #   Kubernetes: kubectl set image deployment/api api=registry/api:${{ github.sha }}
        #   Cloud: aws ecs update-service --cluster prod --service api --force-new-deployment
        #   FastAPI Cloud: uv run fastapi deploy --environment production
        # env:
        #   DEPLOYMENT_TOKEN: ${{ secrets.PRODUCTION_DEPLOYMENT_TOKEN }}

      - name: Create deployment record
        if: always()
        run: |
          echo "Creating production deployment record..."
          echo "Status: ${{ job.status }}"
          echo "Environment: production"
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"

  production-smoke-tests:
    name: Production Smoke Tests
    needs: [deploy-production]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run production smoke tests
        run: |
          echo "🧪 Running production smoke tests..."
          sleep 3
          echo "✅ Production health check passed"
          echo "✅ API responding correctly"
          echo "✅ Database operational"
          echo "✅ Frontend serving"
        # TODO: Replace with actual production smoke tests
        # CRITICAL: Verify deployment succeeded before marking as complete
        # Examples:
        #   curl -f https://api.example.com/api/v1/health || exit 1
        #   curl -f https://api.example.com/api/v1/health/db || exit 1
        #   curl -f https://example.com/ | grep -q "<!DOCTYPE html>" || exit 1
        #   pytest tests/smoke/ --base-url=https://api.example.com --maxfail=1

      - name: Monitor deployment
        run: |
          echo "📊 Monitoring deployment metrics..."
          echo "Response time: OK"
          echo "Error rate: 0%"
          echo "Uptime: 100%"

  notify-success:
    name: Notify Success
    needs: [production-smoke-tests]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Create success notification
        run: |
          echo "✅ Production deployment completed successfully"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  notify-failure:
    name: Notify Failure
    needs: [verify-tests, build-production, deploy-production, production-smoke-tests]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create failure notification
        run: |
          echo "❌ Production deployment failed"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Check workflow logs immediately"
